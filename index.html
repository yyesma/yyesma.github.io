<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esma Yıldırım | Portföy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        h1 { margin-bottom: 10px; color: #38bdf8; }
        p { color: #94a3b8; line-height: 1.6; }
        .tag {
            display: inline-block;
            background: #334155;
            padding: 5px 12px;
            border-radius: 20px;
            margin: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Esma Yıldırım</h1>
        <p>Bilgisayar Mühendisliği Öğrencisi</p>
        <p>Kişisel portföy web sitem hazırlanıyor...</p>
        <div>
            <span class="tag">C#</span>
            <span class="tag">C++</span>
            <span class="tag">Python</span>
            <span class="tag">SQL</span>
        </div>
    </div>
</body>
</html>
